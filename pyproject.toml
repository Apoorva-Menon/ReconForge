[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconforge"
version = "0.1.0"
description = "Self-evolving long-horizon reconciliation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk",
  "litellm",
  "pydantic>=2",
  "pymongo",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
